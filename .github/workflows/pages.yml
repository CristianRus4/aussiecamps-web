name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Drip publishing: a daily build at 07:15 NZDT (18:15 UTC; 06:15 in NZST) publishes every guide whose
  # publishAt has come (lib/publish.ts). Scheduled runs always build the latest commit on main.
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: article and translation dates are read from git log, and a shallow clone
          # would date every guide to the deploy commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One publish day for the whole job, so the build, export and tests agree even across midnight.
      - run: echo "BUILD_DATE=$(TZ=Pacific/Auckland date +%F)" >> "$GITHUB_ENV"
      # Fast gate for the deploy: content audit, build and static export. The full test suite runs
      # separately in checks.yml after every push and reports failures without holding the deploy.
      - run: npm run deploy:gate
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # Decrypts the place pages' data (scripts/decrypt-places.mjs); this repository is public.
          PLACES_KEY: ${{ secrets.PLACES_KEY }}
      # The place pages that don't fit on GitHub Pages go to a Cloudflare Worker, from this same build, so
      # they load the CSS of the build that is going live (docs/places-cloudflare.md). Skipped until the
      # CLOUDFLARE_API_TOKEN secret exists.
      - name: Deploy the extra place pages to Cloudflare
        # A failure here never holds back the site's own deploy; it shows as a warning on the run.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret: the extra place pages were not deployed."; exit 0; fi
          npm run places:worker
          # Every page into R2 too (no file limit), ahead of the Worker reading from it.
          PLACES_R2=1 NODE_ENV=production npx tsx scripts/export-place-pages.tsx --out r2-dist
          node scripts/sync-places-r2.mjs aussiecamps-places r2-dist
          npx wrangler deploy --config places-worker/wrangler.jsonc
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        # The export is several thousand files across 28 languages; Pages can take longer than the
        # action's 10-minute default to sync them, which cancels a deployment that would succeed.
        with:
          timeout: 1800000
