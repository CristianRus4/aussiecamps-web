name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Drip publishing: a daily build at 07:15 NZDT (18:15 UTC; 06:15 in NZST) publishes every guide whose
  # publishAt has come (lib/publish.ts). Scheduled runs always build the latest commit on main.
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: article and translation dates are read from git log, and a shallow clone
          # would date every guide to the deploy commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One publish day for the whole job, so the build, export and tests agree even across midnight.
      - run: echo "BUILD_DATE=$(TZ=Pacific/Auckland date +%F)" >> "$GITHUB_ENV"
      # Fast gate for the deploy: content audit, build and static export. The full test suite runs
      # separately in checks.yml after every push and reports failures without holding the deploy.
      - run: npm run deploy:gate
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          # Decrypts the place pages' data (scripts/decrypt-places.mjs); this repository is public.
          PLACES_KEY: ${{ secrets.PLACES_KEY }}
      # The place pages that don't fit on GitHub Pages and the live trip and collection links go to a
      # Cloudflare Worker, from this same build, so they load the CSS of the build that is going live
      # (docs/places-cloudflare.md). Skipped until the CLOUDFLARE_API_TOKEN secret exists.
      - name: Deploy the extra place pages to Cloudflare
        # A failure here never holds back the site's own deploy; it shows as a warning on the run.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_OPTIONS: --max-old-space-size=12288
          # Every page goes to the R2 bucket (no file limit); the Worker serves them from there.
          PLACES_R2: "1"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret: the extra place pages were not deployed."; exit 0; fi
          npm run places:worker
          # The live links' page shell and place cards go into the same folder, so the sync keeps them.
          npm run links:assets -- --out worker-dist
          node scripts/sync-places-r2.mjs aussiecamps-places worker-dist
          # The bucket of the links people publish from the app; the deploy needs it to exist.
          if ! created=$(npx wrangler r2 bucket create aussiecamps-links 2>&1); then
            if echo "$created" | grep -qi "already exists"; then echo "R2 bucket aussiecamps-links already exists."; else echo "$created"; exit 1; fi
          fi
          npx wrangler deploy --config places-worker/wrangler.jsonc
          # The links API's day counters (counters/, one per address and day) go after 2 days, its day totals
          # (stats/) after 400. Added once each (the rule's name marks it), after the deploy so they never hold
          # the Worker back; a failure to list or add still fails the step.
          rules=$(npx wrangler r2 bucket lifecycle list aussiecamps-links)
          echo "$rules" | grep -q "expire-link-counters" || npx wrangler r2 bucket lifecycle add aussiecamps-links expire-link-counters counters/ --expire-days 2 --force
          echo "$rules" | grep -q "expire-link-stats" || npx wrangler r2 bucket lifecycle add aussiecamps-links expire-link-stats stats/ --expire-days 400 --force
      # The live links' shell page is only for the Worker; GitHub Pages never serves it, even when the step
      # above was skipped or failed before taking it out of the export.
      - run: rm -rf pages-dist/link-shell
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        # The export is several thousand files across 28 languages; Pages can take longer than the
        # action's 10-minute default to sync them, which cancels a deployment that would succeed.
        with:
          timeout: 1800000
